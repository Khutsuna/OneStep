<a class="card" [routerLink]="['/products', product().id]">
  <div class="photo">
    <app-product-image [url]="product().mainImageUrl" [alt]="product().name" [icon]="icon()" />
    @if (product().campaignName) {
      <span class="campaign">{{ product().campaignName }}</span>
    }
  </div>

  <div class="body">
    @if (product().brandName) {
      <span class="brand">{{ product().brandName }}</span>
    }
    <h3 class="name">{{ product().name }}</h3>
    <app-rating-stars [rating]="product().averageRating" [count]="product().reviewCount" />
    <app-price-tag class="price" [price]="product().price" [finalPrice]="product().finalPrice" />

    @if (!product().inStock) {
      <span class="stock out">Out of stock</span>
    } @else if (product().stockQuantity <= 5) {
      <span class="stock low">Only {{ product().stockQuantity }} left</span>
    }
  </div>
</a>
